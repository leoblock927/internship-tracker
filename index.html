<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Internship Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect y='1' width='16' height='2.4' rx='1' fill='%23E8670E'/%3E%3Crect y='5' width='16' height='2.4' rx='1' fill='%231F9255'/%3E%3Crect y='9' width='16' height='2.4' rx='1' fill='%23D12E2A'/%3E%3Crect y='13' width='16' height='2.4' rx='1' fill='%232C68C4'/%3E%3C/svg%3E">
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <a class="brand" href="#pipeline"><span class="loom" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Leo Block <small>/ Internship Tracker</small></a>
      <nav class="tabs" id="tabs" aria-label="Views" hidden>
        <button data-view="pipeline">Pipeline<span class="count" id="c-pipeline"></span></button>
        <button data-view="applications">Applications<span class="count" id="c-applications"></span></button>
        <button data-view="waiting">Waiting<span class="count" id="c-waiting"></span></button>
        <button data-view="summary">Summary</button>
      </nav>
      <button class="iconbtn" id="theme" title="Switch light or dark" aria-label="Switch light or dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="iconbtn" id="lockbtn" title="Lock (asks for your password again)" aria-label="Lock" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
  </header>

  <div class="wrap">
    <section id="lock" class="lock" hidden></section>

    <section id="app" hidden>
      <div class="titleblock" id="titleblock">
        <div><div class="k">Daily scan</div><div class="v"><span class="state" id="scanstate">Loading</span></div></div>
        <div><div class="k">Last run</div><div class="v" id="lastrun">...</div></div>
        <div><div class="k">Last run found</div><div class="v" id="lastfound">...</div></div>
        <div><div class="k">Schedule</div><div class="v" id="schedule">7:41 AM CT daily</div></div>
        <div class="actions">
          <button class="btn warn" id="pausebtn" data-act="toggle-pause">Pause</button>
          <button class="btn go" data-act="run-scan" title="Start a scan now, even if paused">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Run scan
          </button>
          <button class="btn" data-act="run-detect" title="Re-check which job boards watchlist companies use">Re-detect boards</button>
          <button class="btn" data-act="refresh" title="Reload data">Refresh</button>
        </div>
      </div>
      <main id="view"></main>
    </section>

    <footer class="foot" id="foot" hidden>
      <span id="footstatus"></span>
      <a href="#" data-act="open-repo">Open the repo</a>
      <a href="#" data-act="open-actions">Run history</a>
      <a href="#" data-act="export">Download a backup (JSON)</a>
      <a href="#" data-act="pair">Set up my phone</a>
      <a href="#" data-act="change-password">Change password</a>
      <a href="#" data-act="forget">Forget this device</a>
    </footer>
  </div>

  <dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js?v=9"></script>
</body>
</html>
